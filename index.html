<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c47ff"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>SplitMojo</title>
<style>
:root{--p:#6c47ff;--bg:#f5f4fb;--c:#fff;--t:#1d1b29;--m:#6b6880}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{background:var(--p);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-weight:700;font-size:20px}
.steps{display:flex;gap:4px;padding:8px 12px;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 1px 4px #0001}
.steps span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;color:var(--m)}.steps .on{background:var(--p);color:#fff}
main{padding:12px;max-width:560px;margin:auto}.card{background:var(--c);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{margin:0 0 10px;font-size:18px}input,select{font:inherit;padding:10px;border:1px solid #ddd;border-radius:10px;width:100%;background:#fff}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#ece8ff;color:var(--p);font-weight:600}
button.pri{background:var(--p);color:#fff}.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row .n{flex:2}.row .pr{flex:1;max-width:100px}
.x{background:#ffe9ec;color:#c22;padding:10px 12px}.muted{color:var(--m);font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:7px 12px;border-radius:20px;background:#eee;color:var(--t);font-weight:500}.chip.on{background:var(--p);color:#fff}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -1px 6px #0002}.bar button{flex:1}
.big{display:block;width:100%;padding:28px;text-align:center;border:2px dashed var(--p);border-radius:14px;color:var(--p);font-weight:600;background:#fff}
.prog{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--p);width:0}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 0}td:last-child{text-align:right}.tot td{font-weight:700;border-top:1px solid #eee;padding-top:8px}
.owe{font-size:22px;font-weight:800;color:var(--p)}.hide{display:none}img.prev{max-width:100%;border-radius:10px;margin-top:10px;max-height:240px}
.warn{background:#fff4d6;padding:10px;border-radius:10px;font-size:14px;margin-bottom:10px}
</style></head><body>
<header>🧾 SplitMojo</header>
<div class="steps" id="steps"><span>1 Scan</span><span>2 Group</span><span>3 Assign</span><span>4 Results</span></div>
<main id="app"></main>
<div class="bar"><button id="back">Back</button><button class="pri" id="next">Next</button></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="split.js"></script>
<script src="app.js"></script>
</body></html>
